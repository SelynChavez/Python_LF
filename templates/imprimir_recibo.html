<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imprimir Recibo</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #pdfFrame { border: 0; width: 100%; height: 100vh; }
        #aviso {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 8px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        #aviso a { color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="aviso">
        Si la impresión no inicia automáticamente,
        <a href="javascript:imprimir()">haga clic aquí para imprimir</a>.
    </div>
    <iframe id="pdfFrame" src="{{ url_for('recibos.ver_recibo_pdf', filename=filename) }}"></iframe>
    <script>
        function imprimir() {
            var f = document.getElementById('pdfFrame');
            try {
                f.contentWindow.focus();
                f.contentWindow.print();
            } catch (e) {
                window.print();
            }
        }
        // Lanza el diálogo de impresión cuando el PDF termina de cargar.
        document.getElementById('pdfFrame').addEventListener('load', function () {
            setTimeout(imprimir, 500);
        });
    </script>
</body>
</html>
