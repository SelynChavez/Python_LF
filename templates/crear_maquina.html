{% extends "base.html" %}
{% block title %}Agregar Máquina - Combustible{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <i class="bi-plus-circle"></i> Agregar Nueva Máquina
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('crear_maquina') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="numero" class="form-label">Número de Máquina *</label>
                            <input type="text" class="form-control" id="numero" 
                                   name="numero" required 
                                   pattern="[A-Z0-9\-]+" 
                                   title="Solo letras mayúsculas, números y guiones">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="tipo_combustible" class="form-label">Tipo de Combustible *</label>
                            <select class="form-select" id="tipo_combustible" name="tipo_combustible" required>
                                <option value="">Seleccionar combustible...</option>
                                {% for fuel in fuels %}
                                <option value="{{ fuel.id }}">{{ fuel.nombre }} - ${{ fuel.precio_unitario }}/gal</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="lectura_inicial" class="form-label">Lectura Inicial</label>
                            <input type="number" class="form-control" id="lectura_inicial" name="lectura_inicial" step="0.01" min="0" value="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="capacidad_stock" class="form-label">Capacidad (galones) *</label>
                            <input type="number" class="form-control" id="capacidad_stock" name="capacidad_stock" step="0.1" min="100" required>
                        </div>                        
                        <div class="col-md-4 mb-3">
                            <label for="disponible_stock" class="form-label">Stock Inicial *</label>
                            <input type="number" class="form-control" id="disponible_stock" name="disponible_stock" step="0.1" min="0" required>
                        </div>
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="bi-info-circle"></i>
                        <strong>Nota:</strong> La lectura inicial es el valor del medidor al momento de instalar la máquina.
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('maquinas') }}" class="btn btn-secondary me-md-2">
                            <i class="bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi-save"></i> Guardar Máquina
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
