{% extends "base.html" %}

{% block title %}Reporte - Saldos de Deuda Combustible{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-fuel-pump"></i> Reporte de Saldos de Deuda de Combustible</h4>
            </div>
            <div class="card-body">
                <form id="formReporte" action="/generar_reporte" method="POST" target="_blank">
                    <input type="hidden" id="cod" name="cod" value="REP_SALDOS_COMB">
                    <input type="hidden" id="titulo" name="titulo" value="Saldos de Deuda de Combustible por Padrón">
                    <input type="hidden" id="subtitulo" name="subtitulo" value="Saldo = Ventas Crédito − Cobranzas">

                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle"></i>
                        <strong>Nota:</strong> Saldo = ventas de combustible a <b>Crédito</b> − cobranzas (aporte COBRO.COMB en recibos Serie 5 activos).
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary me-md-2">
                            <i class="bi bi-eye"></i> Generar y Ver Reporte
                        </button>
                        <a href="{{ url_for('reportes.reportes') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
