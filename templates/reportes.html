{% extends "base.html" %}
{% block title %}ETLF - Reportes{% endblock %}
{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-speedometer2"></i> Reportes</h4>
            </div>
        </div>
    </div>
</div>

<div class="row">

    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card dashboard-card">
            <p><b>Rep. Recibos Serie #1 por Fechas y Padron</b></p>
            <a href="{{ url_for('rep1recibos') if session.user_rol == 'ADMIN' else '#' }}" 
               class="btn btn-primary {{ 'disabled' if session.user_rol != 'ADMIN' }}">
                <i class="bi bi-eye"></i> Rep #1 Aportes
            </a>
        </div>
    </div>
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card dashboard-card">
            <p><b>Rep. Recibos Serie #1 por Fechas y Aportes</b></p>
            <a href="{{ url_for('rep2recibos') if session.user_rol == 'ADMIN' else '#' }}" 
               class="btn btn-primary {{ 'disabled' if session.user_rol != 'ADMIN' }}">
                <i class="bi bi-eye"></i> Rep #2 Aportes
            </a>
        </div>
    </div>

    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card dashboard-card">
            <p>Reporte multiple de los Prestamos</p>
            <button class="btn btn-secondary" disabled>
                <i class="bi bi-tools"></i> Próximamente
            </button>
        </div>
    </div>


{% endblock %}
