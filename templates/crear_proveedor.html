{% extends "base.html" %}
{% block title %}ETLF - Crear Proveedor {% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Crear Nuevo Proveedor</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('crear_proveedor') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre Completo *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="ruc" class="form-label">RUC *</label>
                            <input type="number" class="form-control" id="ruc" name="ruc" min="0" max="99999999999" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="contacto" class="form-label">Persona de Contacto *</label>
                            <input type="text" class="form-control" id="contacto" name="contacto" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cargo" class="form-label">Cargo *</label>
                            <input type="text" class="form-control" id="cargo" name="cargo" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fono" class="form-label">Fono *</label>
                            <input type="text" class="form-control" id="fono" name="fono" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tipo" class="form-label">Tipo de Proveedor *</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="">Seleccionar Tipo...</option>
                                <option value="COMBUSTIBLE">Combustible</option>
                                <option value="REPUESTOS">Repuestos</option>
                                <option value="LLANTAS">Llantas</option>
                                <option value="OTRO">Otro Tipo</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">E.Mail *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                            <div class="form-text">Maximo 100 caracteres</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <input type="text" class="form-control" id="observaciones" name="observaciones">
                            <div class="form-text">Maximo 100 caracteres</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="direccion" class="form-label">Direccion *</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" required>
                        </div>
                    </div>


                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"> <i class="bi bi-check-circle"></i> Crear Proveedor </button>
                        <a href="{{ url_for('listar_proveedores') }}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
