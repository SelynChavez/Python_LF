{% extends "base.html" %}

{% block title %}Reporte - Envíos a Bóveda {% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-cash-stack"></i> Reporte de Envíos a Bóveda</h4>
            </div>
            <div class="card-body">
                <form id="formReporte" action="/generar_pdf_envios_boveda" method="POST" target="_blank">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="p1" class="form-label">Fecha Desde</label>
                            <input type="date" class="form-control" id="p1" name="p1" value="{{ p1 }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="p2" class="form-label">Fecha Hasta</label>
                            <input type="date" class="form-control" id="p2" name="p2" value="{{ p2 }}" required>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label for="p3" class="form-label">Usuario</label>
                            <select class="form-select" id="p3" name="p3">
                                <option value="0">Todos los Usuarios</option>
                                {% for usuario in usuarios %}
                                <option value="{{ usuario.webuser }}">{{ usuario.webuser }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button type="submit" class="btn btn-primary me-md-2">
                            <i class="bi bi-eye"></i> Generar y Ver Reporte
                        </button>
                        <a href="{{ url_for('reportes.reportes') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
